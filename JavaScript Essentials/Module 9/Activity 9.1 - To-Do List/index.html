<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        h1 {
            color: #047857;
        }

        .add-task {
            display: flex;
            gap: 8px;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            font-size: 15px;
            color: #ffffff;
            background-color: #047857;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #taskList {
            padding: 0;
            list-style: none;
        }

        #taskList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #ecfdf5;
            border-radius: 6px;
            word-break: break-word;
        }

        #taskList li button {
            padding: 6px 10px;
            font-size: 14px;
            background-color: #b91c1c;
        }

        .message {
            min-height: 1.2em;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>

    <!-- Input and Add Task button -->
    <div class="add-task">
        <input type="text" id="taskInput" placeholder="Add a new task" aria-label="New task">
        <button type="button" id="addTaskButton">Add Task</button>
    </div>
    <p id="message" class="message" aria-live="polite"></p>

    <!-- The tasks are shown here -->
    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
</html>
