<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Write a new reflection in My ITOL Vault.">
    <title>New Entry | My ITOL Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/new-entry.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">My ITOL Vault</a>

            <nav class="main-nav" aria-label="Main">
                <ul>
                    <li><a href="index.html">Journal</a></li>
                    <li><a href="vault.html">Vault</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="new-entry.html" class="button button-dark" aria-current="page">New Entry</a>
                <a href="vault.html" class="profile-link" aria-label="My profile: all my entries">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="10" r="3.5" fill="currentColor"/>
                        <path d="M5.5 18.5c1.4-2.6 3.8-4 6.5-4s5.1 1.4 6.5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main id="main" class="page page-editor">
        <form id="entryForm" class="editor" novalidate>
            <div class="editor-heading">
                <p id="entryDate" class="editor-date"></p>
                <label for="entryTitle" class="visually-hidden">Title</label>
                <input type="text" id="entryTitle" class="title-input" placeholder="Untitled Reflection" maxlength="120" autocomplete="off">
            </div>

            <!-- Tags: chips are added by js/new-entry.js -->
            <div class="tag-row">
                <ul id="tagList" class="tag-chips" aria-label="Tags"></ul>
                <button type="button" id="addTagButton" class="chip chip-add">+ Add Tag</button>
                <label for="tagInput" class="visually-hidden">New tag</label>
                <input type="text" id="tagInput" class="chip-input" placeholder="Tag, then Enter" maxlength="20" hidden>
            </div>

            <aside class="insight">
                <p class="insight-label">Depth Insight</p>
                <p>Write without judgment. The vault remembers only what you choose to ink.</p>
            </aside>

            <div class="editor-body">
                <label for="entryBody" class="visually-hidden">Your reflection</label>
                <textarea id="entryBody" placeholder="Begin your reflection..." maxlength="5000"></textarea>
            </div>

            <p id="formMessage" class="form-message" aria-live="polite"></p>

            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <button type="button" id="memoryButton" class="tool-button">
                        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="currentColor"/><path d="M6 17l4-5 3 3 2-2 3 4z" fill="#fff"/></svg>
                        Insert Memory
                    </button>
                    <button type="button" id="privateButton" class="tool-button" aria-pressed="false">
                        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        Private
                    </button>
                </div>
                <div class="toolbar-group">
                    <button type="button" id="discardButton" class="button button-text">Discard</button>
                    <button type="submit" id="saveButton" class="button button-dark">Save Entry</button>
                </div>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 My ITOL Vault. Designed for reflection.</p>
            <ul class="footer-links">
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="vault.html">Archive</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
