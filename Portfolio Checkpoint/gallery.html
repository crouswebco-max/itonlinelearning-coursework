<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive nine-image gallery built with Tailwind CSS grid utilities.">
    <title>Gallery | Juan Crous</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-brand-red: #da373d;
            --color-deep-charcoal: #1a1a1a;
        }
    </style>
</head>
<body class="min-h-screen bg-stone-100 font-sans text-deep-charcoal">
    <header class="border-b-2 border-deep-charcoal bg-white">
        <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-6 gap-y-4 px-6 py-5" aria-label="Main navigation">
            <a href="home.html" class="text-sm font-black tracking-tight transition-colors hover:text-brand-red">JUAN_CROUS</a>
            <div class="order-last flex w-full flex-wrap items-center gap-x-6 gap-y-2 text-xs font-bold uppercase tracking-widest sm:order-none sm:w-auto sm:gap-8">
                <a href="home.html" class="transition-colors hover:text-brand-red">Home</a>
                <a href="projects.html" class="transition-colors hover:text-brand-red">Work</a>
                <a href="gallery.html" class="border-b-2 border-deep-charcoal pb-1 transition-colors hover:text-brand-red">Gallery</a>
                <a href="contact.html" class="transition-colors hover:text-brand-red">Contact</a>
            </div>
            <a href="contact.html" class="border-2 border-deep-charcoal bg-deep-charcoal px-4 py-2 text-[10px] font-black tracking-widest text-white transition-colors hover:border-brand-red hover:bg-brand-red">GET_IN_TOUCH</a>
        </nav>
    </header>

    <main class="mx-auto max-w-7xl px-6 py-16">
        <section class="mb-10 flex flex-col justify-between gap-5 border-b-2 border-deep-charcoal pb-8 sm:flex-row sm:items-end">
            <div>
                <p class="mb-4 text-xs font-bold uppercase tracking-[0.35em] text-brand-red">Gallery // nine photographs</p>
                <h1 class="text-4xl font-black uppercase leading-none tracking-[-0.05em] sm:text-6xl lg:text-7xl">Image gallery</h1>
            </div>
            <p class="max-w-xs text-sm leading-6 text-stone-600">Nine photographs in a responsive grid: one column on a phone, two on a tablet and three on a computer. Hover a photo to bring its colour back.</p>
        </section>

        <section class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-label="Image gallery">
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image1.jpg" alt="Cyclists racing past, blurred by the speed, in black and white"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Race day</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image2.jpg" alt="A kitchen worktop from above, with a pestle and mortar, a frying pan, knives and small bowls of spices"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Kitchen table</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image3.jpg" alt="A hillside covered in pine trees, seen from a distance"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Hillside forest</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image4.jpg" alt="Waves breaking over dark rocks at dusk"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Evening sea</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image5.jpg" alt="A red umbrella at night, with blurred city lights behind it"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Red umbrella</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image6.jpg" alt="People walking on a wide beach at sunset, with mountains in the distance"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Beach at sunset</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image7.jpg" alt="Sunlight coming through the trees in a wood"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Light in the trees</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image8.jpg" alt="An empty road curving along a hillside at sunset"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">The long road</figcaption></figure>
            <figure class="group border-2 border-deep-charcoal bg-white p-3 transition-colors hover:bg-brand-red"><img class="aspect-square w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" src="images/image9.jpg" alt="A bulldog looking up at the camera on a paved street"><figcaption class="pt-3 text-xs font-black uppercase tracking-widest">Good boy</figcaption></figure>
        </section>
    </main>

    <footer class="border-t-2 border-deep-charcoal bg-stone-200">
        <div class="mx-auto flex max-w-7xl flex-col gap-3 px-6 py-6 text-[10px] font-bold uppercase tracking-widest text-stone-500 sm:flex-row sm:items-center sm:justify-between">
            <p>© 2026 Juan Crous · Crous WebCo</p>
            <div class="flex flex-wrap gap-5">
                <a href="https://github.com/CrousWebco-tech" class="transition-colors hover:text-brand-red">GitHub</a>
                <a href="projects.html" class="transition-colors hover:text-brand-red">Work</a>
                <a href="home.html" class="transition-colors hover:text-brand-red">Home</a>
            </div>
        </div>
    </footer>
</body>
</html>
