<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Example: useCallback</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const lessons = [
            { id: "what", number: 1, title: "What useCallback Does" },
            { id: "why", number: 2, title: "Why It Matters" }
        ];

        function Terminal({ children }) {
            return <pre className="terminal"><code>{children}</code></pre>;
        }

        function Lesson({ id, number, title, children }) {
            return (
                <section id={id} className="lesson">
                    <p className="lesson-number">Lesson {number}</p>
                    <h2>{title}</h2>
                    {children}
                </section>
            );
        }

        const { useCallback, useEffect, useRef } = React;

        const SETS = { lowercase: "abcdefghijklmnopqrstuvwxyz", uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", numbers: "0123456789", symbols: "!@#$%^&*()-_=+[]{};:,.?/~" };

        // Secure random index (crypto), used for every character
        function randomIndex(max) {
            const values = new Uint32Array(1);
            crypto.getRandomValues(values);
            return values[0] % max;
        }

        function makePassword(length, pool) {
            let result = "";
            for (let i = 0; i < length; i++) result += pool[randomIndex(pool.length)];
            return result;
        }

        // ============================================
        // MODULE 8 LESSON 3: USECALLBACK
        // ============================================
        function WhatLesson() {
            return (
                <Lesson {...lessons[0]}>
                    <p>
                        Every time a component renders, every function inside it is <strong>made again</strong>. Usually that's fine.
                        <code> useCallback</code> keeps the <strong>same</strong> function between renders, and only makes a new one when something it uses changes:
                    </p>
                    <Terminal>{`const passwordGenerator = useCallback(() => {
  let pool = LETTERS;
  if (numberAllowed) pool += NUMBERS;
  if (characterAllowed) pool += SYMBOLS;
  setPassword(makePassword(length, pool));
}, [length, numberAllowed, characterAllowed]);   // the dependencies`}</Terminal>
                    <ul>
                        <li>The <strong>dependency array</strong> lists every value from the component that the function uses.</li>
                        <li>Leave one out, and the function keeps using its <strong>old value</strong>, which is a bug that's hard to spot.</li>
                        <li>Setter functions like <code>setPassword</code> never change, so they don't need to be listed.</li>
                    </ul>
                </Lesson>
            );
        }

        function WhyDemo() {
            const [length, setLength] = useState(12);
            const [other, setOther] = useState(0);
            const [created, setCreated] = useState(0);

            const passwordGenerator = useCallback(() => makePassword(length, SETS.lowercase + SETS.uppercase), [length]);

            // Runs only when passwordGenerator is a NEW function, so it counts how many were made
            useEffect(() => {
                setCreated((count) => count + 1);
            }, [passwordGenerator]);

            return (
                <div className="demo">
                    <p className="demo-label">Live demo</p>
                    <div className="demo-buttons" style={{ flexWrap: "wrap" }}>
                        <button onClick={() => setOther(other + 1)}>Re-render ({other})</button>
                        <button onClick={() => setLength(length + 1)}>Length + 1 ({length})</button>
                    </div>
                    <p className="demo-note">New passwordGenerator functions made: <strong>{created}</strong></p>
                    <p className="demo-note">"Re-render" changes unrelated state: the count stays the same. Changing the length (a dependency) makes a new function.</p>
                </div>
            );
        }

        function WhyLesson() {
            return (
                <Lesson {...lessons[1]}>
                    <p>
                        It matters most when the function is a <strong>dependency of <code>useEffect</code></strong>, or is passed to a child.
                        Without <code>useCallback</code>, a "new" function every render would make the effect run after every render.
                    </p>
                    <WhyDemo />
                </Lesson>
            );
        }

        function App() {
            return (
                <>
                    <header className="site-header">
                        <p className="course">React Essentials · Module 8</p>
                        <h1>useCallback</h1>
                        <nav aria-label="Lessons">
                            <ul>
                                {lessons.map((lesson) => (
                                    <li key={lesson.id}>
                                        <a href={`#${lesson.id}`}>{lesson.number}. {lesson.title}</a>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </header>
                    <main>
                        <WhatLesson />
                        <WhyLesson />
                    </main>
                    <footer className="site-footer">
                        <p>Built with React {React.version}</p>
                    </footer>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <noscript>This page is built with React, so it needs JavaScript turned on.</noscript>
</body>
</html>
