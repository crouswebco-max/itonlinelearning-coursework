<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Example: Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const lessons = [
            { id: "setup", number: 1, title: "Setting Up the Project" },
            { id: "state", number: 2, title: "The State" }
        ];

        function Terminal({ children }) {
            return <pre className="terminal"><code>{children}</code></pre>;
        }

        function Lesson({ id, number, title, children }) {
            return (
                <section id={id} className="lesson">
                    <p className="lesson-number">Lesson {number}</p>
                    <h2>{title}</h2>
                    {children}
                </section>
            );
        }

        const { useCallback, useEffect, useRef } = React;

        const SETS = { lowercase: "abcdefghijklmnopqrstuvwxyz", uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", numbers: "0123456789", symbols: "!@#$%^&*()-_=+[]{};:,.?/~" };

        // Secure random index (crypto), used for every character
        function randomIndex(max) {
            const values = new Uint32Array(1);
            crypto.getRandomValues(values);
            return values[0] % max;
        }

        function makePassword(length, pool) {
            let result = "";
            for (let i = 0; i < length; i++) result += pool[randomIndex(pool.length)];
            return result;
        }

        // ============================================
        // MODULE 8 LESSON 1: PASSWORD GENERATOR
        // ============================================
        function SetupLesson() {
            return (
                <Lesson {...lessons[0]}>
                    <p>This module builds a <strong>password generator</strong> with Vite and Tailwind CSS. Setting it up:</p>
                    <Terminal>{`npm create vite@latest password-generator -- --template react
cd password-generator
npm install
npm install -D tailwindcss@3 postcss autoprefixer
npx tailwindcss init -p`}</Terminal>
                    <p>Then tell Tailwind where your classes are (<code>tailwind.config.js</code>) and add its directives to <code>src/index.css</code>:</p>
                    <Terminal>{`// tailwind.config.js
export default {
  content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"],
  theme: { extend: {} },
  plugins: [],
};

/* src/index.css */
@tailwind base;
@tailwind components;
@tailwind utilities;`}</Terminal>
                    <p className="tip">The <code>init -p</code> command belongs to Tailwind version 3, which is why <code>tailwindcss@3</code> is installed. Tailwind 4 is set up a different way.</p>
                </Lesson>
            );
        }

        function StateLesson() {
            const [length, setLength] = useState(10);
            const [numberAllowed, setNumberAllowed] = useState(false);
            const [characterAllowed, setCharacterAllowed] = useState(false);
            const [password, setPassword] = useState("");

            const generate = () => {
                let pool = SETS.lowercase + SETS.uppercase;
                if (numberAllowed) pool += SETS.numbers;
                if (characterAllowed) pool += SETS.symbols;
                setPassword(makePassword(length, pool));
            };

            return (
                <Lesson {...lessons[1]}>
                    <p>The generator needs four pieces of state:</p>
                    <Terminal>{`const [length, setLength] = useState(10);
const [numberAllowed, setNumberAllowed] = useState(false);
const [characterAllowed, setCharacterAllowed] = useState(false);
const [password, setPassword] = useState("");`}</Terminal>
                    <div className="demo" style={{ textAlign: "left" }}>
                        <p className="demo-label">Live demo</p>
                        <input readOnly value={password} placeholder="Click Generate" aria-label="Password" style={{ width: "100%", boxSizing: "border-box", fontFamily: "monospace" }} />
                        <div className="demo-buttons" style={{ justifyContent: "flex-start", flexWrap: "wrap", marginTop: 10 }}>
                            <label className="demo-note"><input type="range" min="6" max="40" value={length} onChange={(e) => setLength(+e.target.value)} /> Length: {length}</label>
                            <label className="demo-note"><input type="checkbox" checked={numberAllowed} onChange={() => setNumberAllowed(!numberAllowed)} /> Numbers</label>
                            <label className="demo-note"><input type="checkbox" checked={characterAllowed} onChange={() => setCharacterAllowed(!characterAllowed)} /> Symbols</label>
                            <button onClick={generate}>Generate</button>
                        </div>
                    </div>
                    <p className="tip">Passwords should use <code>crypto.getRandomValues()</code>, the browser's secure random number generator. <code>Math.random()</code> is fine for games, but it isn't designed for security.</p>
                </Lesson>
            );
        }

        function App() {
            return (
                <>
                    <header className="site-header">
                        <p className="course">React Essentials · Module 8</p>
                        <h1>Password Generator</h1>
                        <nav aria-label="Lessons">
                            <ul>
                                {lessons.map((lesson) => (
                                    <li key={lesson.id}>
                                        <a href={`#${lesson.id}`}>{lesson.number}. {lesson.title}</a>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </header>
                    <main>
                        <SetupLesson />
                        <StateLesson />
                    </main>
                    <footer className="site-footer">
                        <p>Built with React {React.version}</p>
                    </footer>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <noscript>This page is built with React, so it needs JavaScript turned on.</noscript>
</body>
</html>
