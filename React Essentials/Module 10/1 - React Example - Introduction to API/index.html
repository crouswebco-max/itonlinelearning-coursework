<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Example: Introduction to API</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const lessons = [
            { id: "what", number: 1, title: "What is an API?" },
            { id: "fetch", number: 2, title: "Fetching Data in React" }
        ];

        function Terminal({ children }) {
            return <pre className="terminal"><code>{children}</code></pre>;
        }

        function Lesson({ id, number, title, children }) {
            return (
                <section id={id} className="lesson">
                    <p className="lesson-number">Lesson {number}</p>
                    <h2>{title}</h2>
                    {children}
                </section>
            );
        }

        const { useEffect } = React;

        // ============================================
        // MODULE 10 LESSON 9: INTRODUCTION TO API
        // ============================================
        function WhatLesson() {
            return (
                <Lesson {...lessons[0]}>
                    <p>
                        An <strong>API</strong> (Application Programming Interface) lets your app ask another service for data. For a web API,
                        you send a <strong>request</strong> to a URL and get back a <strong>response</strong>, usually as <strong>JSON</strong>.
                    </p>
                    <div className="tree">{`Your React app  ── GET https://api.themoviedb.org/3/movie/popular ──▶  TMDB server
                ◀── 200 OK  { "results": [ { "title": "…", … } ] } ──`}</div>
                    <ul>
                        <li><strong>Endpoint:</strong> the URL for one kind of data, like <code>/movie/popular</code>.</li>
                        <li><strong>Method:</strong> <code>GET</code> reads data, while <code>POST</code>, <code>PUT</code> and <code>DELETE</code> change it.</li>
                        <li><strong>Status code:</strong> <code>200</code> worked, <code>401</code> not allowed (bad key), <code>404</code> not found.</li>
                        <li><strong>JSON:</strong> text that looks like JavaScript objects and arrays. <code>response.json()</code> turns it into real ones.</li>
                    </ul>
                </Lesson>
            );
        }

        function FetchDemo() {
            const [posts, setPosts] = useState([]);
            const [status, setStatus] = useState("idle");

            const load = async () => {
                setStatus("loading");
                try {
                    const response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=4");
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    setPosts(await response.json());
                    setStatus("done");
                } catch (error) {
                    setStatus(`error: ${error.message}`);
                }
            };

            return (
                <div className="demo" style={{ textAlign: "left" }}>
                    <p className="demo-label">Live demo: a real request to a free practice API</p>
                    <button onClick={load}>Fetch 4 posts</button>
                    <p className="demo-note">Status: {status}</p>
                    <ul className="task-list">{posts.map((post) => <li key={post.id}>{post.title}</li>)}</ul>
                </div>
            );
        }

        function FetchLesson() {
            return (
                <Lesson {...lessons[1]}>
                    <p>In React, fetch data inside <code>useEffect</code> (to load when the component appears) or in an event handler (to load on a click):</p>
                    <Terminal>{`const [movies, setMovies] = useState([]);

useEffect(() => {
  fetch(URL)
    .then((response) => response.json())
    .then((data) => setMovies(data.results));
}, []);   // [] = only when the component first appears`}</Terminal>
                    <FetchDemo />
                </Lesson>
            );
        }

        function App() {
            return (
                <>
                    <header className="site-header">
                        <p className="course">React Essentials · Module 10</p>
                        <h1>Introduction to API</h1>
                        <nav aria-label="Lessons">
                            <ul>
                                {lessons.map((lesson) => (
                                    <li key={lesson.id}>
                                        <a href={`#${lesson.id}`}>{lesson.number}. {lesson.title}</a>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </header>
                    <main>
                        <WhatLesson />
                        <FetchLesson />
                    </main>
                    <footer className="site-footer">
                        <p>Built with React {React.version}</p>
                    </footer>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <noscript>This page is built with React, so it needs JavaScript turned on.</noscript>
</body>
</html>
