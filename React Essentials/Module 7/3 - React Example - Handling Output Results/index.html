<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Example: Handling Output Results</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const lessons = [
            { id: "lift", number: 1, title: "Lifting State Up" },
            { id: "output", number: 2, title: "Working Out the Output" }
        ];

        function Terminal({ children }) {
            return <pre className="terminal"><code>{children}</code></pre>;
        }

        function Lesson({ id, number, title, children }) {
            return (
                <section id={id} className="lesson">
                    <p className="lesson-number">Lesson {number}</p>
                    <h2>{title}</h2>
                    {children}
                </section>
            );
        }

        // The same calculation as the Money Builder app's util/investment.js
        function calculateInvestmentResults({ initialInvestment, annualInvestment, expectedReturn, duration }) {
            const annualData = [];
            let investmentValue = initialInvestment;
            for (let i = 0; i < duration; i++) {
                const interestEarnedInYear = investmentValue * (expectedReturn / 100);
                investmentValue += interestEarnedInYear + annualInvestment;
                annualData.push({ year: i + 1, interest: interestEarnedInYear, valueEndOfYear: investmentValue, annualInvestment });
            }
            return annualData;
        }

        const formatter = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 0, maximumFractionDigits: 0 });

        const START = { initialInvestment: 10000, annualInvestment: 1200, expectedReturn: 6, duration: 5 };
        const LABELS = { initialInvestment: "Initial ($)", annualInvestment: "Annual ($)", expectedReturn: "Return (%)", duration: "Years" };

        function Inputs({ values, onChange }) {
            return (
                <div className="form-grid">
                    {Object.keys(LABELS).map((key) => (
                        <label key={key}>{LABELS[key]}
                            <input type="number" min="0" value={values[key]} onChange={(e) => onChange(key, e.target.value)} />
                        </label>
                    ))}
                </div>
            );
        }

        // ============================================
        // MODULE 7 LESSON 3: HANDLING OUTPUT RESULTS
        // ============================================
        function LiftLesson() {
            return (
                <Lesson {...lessons[0]}>
                    <p>
                        <code>UserInput</code> has the numbers, but <code>OutputData</code> needs them too. Siblings can't share state directly,
                        so it's <strong>lifted up</strong> to their parent, <code>App</code>, and passed down:
                    </p>
                    <div className="tree">{`App            userInput state + handleInputChange
├── UserInput  userInput={userInput} onInputChange={handleInputChange}
└── OutputData inputValue={userInput}`}</div>
                    <Terminal>{`function App() {
  const [userInput, setUserInput] = useState({ ... });
  const handleInputChange = (id, value) => setUserInput((prev) => ({ ...prev, [id]: +value }));

  return (
    <>
      <UserInput userInput={userInput} onInputChange={handleInputChange} />
      <OutputData inputValue={userInput} />
    </>
  );
}`}</Terminal>
                </Lesson>
            );
        }

        function OutputLesson() {
            const [userInput, setUserInput] = useState(START);
            const results = calculateInvestmentResults(userInput);
            const last = results[results.length - 1];

            return (
                <Lesson {...lessons[1]}>
                    <p><code>OutputData</code> doesn't need its own state. It works the results out from its props <strong>every render</strong>:</p>
                    <Terminal>{`const OutputData = ({ inputValue }) => {
  const resultData = calculateInvestmentResults(inputValue);
  ...
};`}</Terminal>
                    <div className="demo" style={{ textAlign: "left" }}>
                        <p className="demo-label">Live demo: change an input and the output follows</p>
                        <Inputs values={userInput} onChange={(key, value) => setUserInput({ ...userInput, [key]: +value })} />
                        {last ? (
                            <p className="demo-note">After {last.year} years: <strong>{formatter.format(last.valueEndOfYear)}</strong></p>
                        ) : (
                            <p className="demo-note">Enter at least 1 year.</p>
                        )}
                    </div>
                    <p className="tip">Format money with <code>Intl.NumberFormat</code> (<code>formatter.format(12345.6)</code> gives <code>$12,346</code>) or <code>.toFixed(2)</code>.</p>
                </Lesson>
            );
        }

        function App() {
            return (
                <>
                    <header className="site-header">
                        <p className="course">React Essentials · Module 7</p>
                        <h1>Handling Output Results</h1>
                        <nav aria-label="Lessons">
                            <ul>
                                {lessons.map((lesson) => (
                                    <li key={lesson.id}>
                                        <a href={`#${lesson.id}`}>{lesson.number}. {lesson.title}</a>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </header>
                    <main>
                        <LiftLesson />
                        <OutputLesson />
                    </main>
                    <footer className="site-footer">
                        <p>Built with React {React.version}</p>
                    </footer>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <noscript>This page is built with React, so it needs JavaScript turned on.</noscript>
</body>
</html>
