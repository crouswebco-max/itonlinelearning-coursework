<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Gallery</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex justify-center p-3 bg-gradient-to-r from-emerald-400 to-emerald-100">
    <main class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image1.jpg" alt="Gallery image 1">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image2.jpg" alt="Gallery image 2">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image3.jpg" alt="Gallery image 3">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image4.jpg" alt="Gallery image 4">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image5.jpg" alt="Gallery image 5">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image6.jpg" alt="Gallery image 6">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image7.jpg" alt="Gallery image 7">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image8.jpg" alt="Gallery image 8">
        <img class="w-64 h-64 border-2 border-emerald-900 p-1" src="gallery/image9.jpg" alt="Gallery image 9">
    </main>
</body>
</html>
